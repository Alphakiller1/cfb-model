name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: Import smoke
        run: |
          python -c "
          from cfbmodel import authority, efficiency, forecast, matrix, preseason, ratings, site, teams
          a = authority.current()
          assert a.level.value == 'RESEARCH_ONLY', a.level
          assert a.may_bet is False
          matrix.validate_weight_group(matrix.OFFENSE_WEIGHTS, name='offense')
          matrix.validate_weight_group(matrix.DEFENSE_WEIGHTS, name='defense')
          print('import smoke OK')
          "

      - name: Matrix mirrors the shared genesis core
        run: python scripts/check_core_sync.py
