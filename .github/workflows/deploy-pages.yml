name: deploy-pages

on:
  push:
    branches: [main]
  schedule:
    # Twice daily Tuesday-Saturday in season. One DraftKings request carries
    # both spreads and totals (2 credits); the free /sports preflight protects
    # the quota floor.
    - cron: "10 14,21 * * 2-6"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to build (blank = current)"
        required: false
      week:
        description: "Week to build (blank = auto)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .

      - name: Restore data snapshots and shadow ledger
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cache
            data/runtime-cache
          key: cfb-runtime-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            cfb-runtime-${{ runner.os }}-

      - name: Build dashboard
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          # Production is single-book and fails closed if no slate line verifies.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_BOOKMAKERS: draftkings
          CFB_REQUIRE_LIVE_ODDS: "1"
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
          IN_SEASON: ${{ github.event.inputs.season }}
          IN_WEEK: ${{ github.event.inputs.week }}
        run: python scripts/build_current.py --out _site/index.html

      - name: Post-build smoke
        run: |
          python scripts/smoke_site.py _site/index.html
          python scripts/verify_build.py _site/build.json

      # Preserve every validated non-empty response even when a later source or
      # release gate fails. The next run can then recover through a bounded
      # provider outage without repeating all successful calls.
      - name: Save data snapshots and shadow ledger
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/cache
            data/runtime-cache
          key: cfb-runtime-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
