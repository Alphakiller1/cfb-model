name: deploy-pages

on:
  push:
    branches: [main]
  schedule:
    # Tuesday 15:10 UTC — after the weekend's results and lines have settled,
    # before the week's slate matters.
    - cron: "10 15 * * 2"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to build (blank = current)"
        required: false
      week:
        description: "Week to build (blank = auto)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .

      - name: Build dashboard
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          # Optional: without it the board still builds, just without a live book row.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_BOOKMAKERS: fanduel
          PYTHONIOENCODING: utf-8
          IN_SEASON: ${{ github.event.inputs.season }}
          IN_WEEK: ${{ github.event.inputs.week }}
        run: python scripts/build_current.py --out _site/index.html

      - name: Post-build smoke
        run: python scripts/smoke_site.py _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
