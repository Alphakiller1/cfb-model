name: deploy-pages

on:
  push:
    branches: [main]
  schedule:
    # In-week paid DraftKings refresh (existing). One request carries spreads
    # and totals; the free /sports preflight protects the quota floor.
    - cron: "10 14,21 * * 2-6"
    # After Saturday: Sunday grades the completed week from cached CFBD + last
    # good odds. Monday advances the board onto the new week. Neither run
    # spends Odds-API credits (CFB_REUSE_ODDS_CACHE).
    - cron: "40 15 * * 0"
    - cron: "40 15 * * 1"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to build (blank = current)"
        required: false
      week:
        description: "Week to build (blank = auto)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .

      - name: Restore data snapshots and shadow ledger
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cache
            data/runtime-cache
          key: cfb-runtime-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            cfb-runtime-${{ runner.os }}-

      - name: Select odds policy
        run: |
          case "${{ github.event.schedule }}" in
            "40 15 * * 0"|"40 15 * * 1")
              echo "CFB_REQUIRE_LIVE_ODDS=0" >> "$GITHUB_ENV"
              echo "CFB_REUSE_ODDS_CACHE=1" >> "$GITHUB_ENV"
              echo "Sunday/Monday rebuild: reuse cached odds, no Odds-API spend."
              ;;
            *)
              echo "CFB_REQUIRE_LIVE_ODDS=1" >> "$GITHUB_ENV"
              ;;
          esac
      - name: Build dashboard
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          # Production is single-book and fails closed if no slate line verifies.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_BOOKMAKERS: draftkings
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
          IN_SEASON: ${{ github.event.inputs.season }}
          IN_WEEK: ${{ github.event.inputs.week }}
        run: python scripts/build_current.py --out _site/index.html

      - name: Post-build smoke
        run: |
          python scripts/smoke_site.py _site/index.html
          python scripts/verify_build.py _site/build.json

      # Preserve every validated non-empty response even when a later source or
      # release gate fails. The next run can then recover through a bounded
      # provider outage without repeating all successful calls.
      - name: Save data snapshots and shadow ledger
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/cache
            data/runtime-cache
          key: cfb-runtime-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
